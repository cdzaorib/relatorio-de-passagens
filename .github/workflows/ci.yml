name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dependências vulneráveis
        # Quebra de propósito. Advisory alta sem correção existe, e quando
        # aparecer o caminho é o mesmo: override no package.json com o motivo
        # escrito, ou upgrade. Passar batido é que não pode.
        run: npm audit --audit-level=high

      - name: Testes
        run: npm test

      - name: Tipos nos testes
        # O build só olha src/. Sem este passo, fixture de teste desatualizada
        # quebra o npm run typecheck de quem clona e ninguém percebe.
        run: npm run typecheck

      - name: Tipos e lint
        # O build roda o ESLint e o TypeScript; se algo estiver torto, ele quebra.
        run: npm run build
        env:
          # Valores de fachada: o build não fala com o banco, mas as telas
          # protegidas precisam que as variáveis existam.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-de-ci
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
